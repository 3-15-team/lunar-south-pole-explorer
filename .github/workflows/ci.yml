name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.59.0'
      - uses: astral-sh/setup-uv@v7
      - run: just setup
      - run: just check
      - run: just setup-py
      - run: just lint
      - run: just test-py
      - run: just api-smoke
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

  containers:
    name: Container checks (no scientific downloads)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose --profile tools run --build --rm --no-deps science python tools/project.py lint
      - run: docker compose --profile tools run --build --rm --no-deps science
      - run: docker compose --profile tools run --build --rm --no-deps web-check

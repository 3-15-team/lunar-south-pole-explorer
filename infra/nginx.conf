server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # resolve the compute container lazily so the web container starts even if compute is down
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $compute http://compute:8000;

  gzip on;
  gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;
  gzip_min_length 1024;

  location / {
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # static products; .bin tiles are already gzip-compressed (the client inflates them)
  location /data/ {
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=3600";
    types {
      application/json json;
      application/geo+json geojson;
      application/octet-stream bin;
      image/png png;
    }
  }
  location /api/ {
    proxy_pass $compute$request_uri;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
  }
  location = /health {
    proxy_pass $compute/health;
  }
}

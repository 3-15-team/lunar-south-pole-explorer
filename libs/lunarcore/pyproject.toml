[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarcore"
version = "0.1.0"
description = "Lunar south-pole geometry, ephemeris tables, terrain horizons, disk fractions, interval metrics and suitability (Python twin of apps/web/src/core)"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "numba>=0.60"]

[project.optional-dependencies]
analysis = ["scipy>=1.11", "pillow>=10"]  # suitability box filters, heatmap PNGs

[tool.setuptools.packages.find]
include = ["lunarcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

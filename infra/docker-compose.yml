# Primary demo stack: `make up` → http://localhost:${COMPOSE_PORT:-8642}
# Paths are relative to the project root (Makefile passes --project-directory).
name: lunar-explorer
services:
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports:
      - "${COMPOSE_PORT:-8642}:80"
    environment:
      # panorama height-field interpolation: bilinear|catmull|mitchell|bspline (browser override: ?interp=…)
      PANO_TERRAIN_INTERP: "${PANO_TERRAIN_INTERP:-catmull}"
      # panorama relief anti-aliasing: pixel-footprint scale (1 = one pixel, 0 = legacy); override: ?raa=…
      PANO_RELIEF_AA: "${PANO_RELIEF_AA:-1}"
      # panorama statistical micro-relief amplitude (0 = off → procedural texture); override: ?micro=…
      PANO_MICRO: "${PANO_MICRO:-1}"
      # initial state of the panorama "Micro-relief" toggle: on|off; empty = app default (config.ts)
      PANO_MICRO_DEFAULT: "${PANO_MICRO_DEFAULT:-}"
      MAP_EARTH_ANTENNA: "${MAP_EARTH_ANTENNA:-}"
    volumes:
      - ./data/web:/usr/share/nginx/html/data:ro
    restart: unless-stopped

  compute:
    build:
      context: .
      dockerfile: services/compute/Dockerfile
    environment:
      DATA_DIR: /data
      NUMBA_CACHE_DIR: /data/work/numba-cache
    volumes:
      - ./data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  texgen:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: services/texgen/Dockerfile
    expose:
      - "8001"

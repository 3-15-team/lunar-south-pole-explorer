name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/services/compute
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pipeline/requirements.txt
            services/compute/requirements.txt
            libs/lunarcore/pyproject.toml
      - name: Install Python dependencies
        run: make setup-py
      - name: Lint Python
        run: .venv/bin/python -m ruff check libs pipeline services
      - name: Test physics, pipeline, and compute API
        run: make test-py
      - name: Smoke-test compute HTTP endpoints
        shell: bash
        run: |
          .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/compute.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/compute.log"' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 --max-time 5 http://127.0.0.1:8000/health
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/api/v1/info

  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: make typecheck
      - name: Test frontend and shared golden vectors
        run: make test-web
      - name: Build production frontend
        run: make web-build
      - name: Smoke-test production frontend
        working-directory: apps/web
        shell: bash
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/web.log"' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 --max-time 5 http://127.0.0.1:4173/ -o "$RUNNER_TEMP/index.html"
          grep -q '<title>Lunar South Pole Site Explorer</title>' "$RUNNER_TEMP/index.html"
      - name: Upload production frontend
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

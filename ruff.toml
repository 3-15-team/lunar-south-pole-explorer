# Python lint config for libs/, pipeline/, services/ (just lint).
line-length = 120
target-version = "py312"
extend-exclude = ["data", "apps", ".venv", "dist-static"]

[lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]
ignore = ["B008", "B905"]

[lint.isort]
known-first-party = ["lunarcore", "pipeline", "app"]

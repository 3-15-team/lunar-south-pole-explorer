# Apply after an online bootstrap, without --build/--pull.
# Scientific/application containers have no external network route. A local-only
# ingress proxy is needed for Docker Desktop's host port forwarding.
services:
  web:
    ports: !reset []
  smoke:
    command: ["python", "tools/project.py", "smoke", "http://offline-gateway", "--analysis"]
    depends_on:
      offline-gateway:
        condition: service_healthy
  offline-gateway:
    image: ${COMPOSE_PROJECT_NAME:-lunar-local}-web
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./infra/offline-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, ingress]
    ports:
      - "127.0.0.1:${COMPOSE_PORT:-8642}:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/ready"]
      interval: 5s
      timeout: 5s
      retries: 6
networks:
  default:
    internal: true
  ingress: {}
